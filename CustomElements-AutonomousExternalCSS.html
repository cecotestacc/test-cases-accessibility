 <!DOCTYPE html>
 <html lang = "en">
     <head>
    <script>
class MyButton extends HTMLButtonElement {
      constructor() {
        super();
      }
		connectedCallback() {
        
        // Dynamically load the stylesheet from the 'data-style' attribute
        const styleHref = this.getAttribute('data-style');
        if (styleHref) {
          this.loadStyle(styleHref);
        }

}
      // Method to load an external stylesheet dynamically
      loadStyle(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      }
    }

    // Register the custom element

    customElements.define('my-button', MyButton, { extends: 'button' });
    </script>
