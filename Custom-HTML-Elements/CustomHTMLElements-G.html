 <!DOCTYPE html>

<script>
class InnerElement extends HTMLElement {
  constructor() {
    super();
    const shadow = this.attachShadow({ mode: 'open' });

    const innerDiv = document.createElement('div');
    innerDiv.textContent = 'This is the inner element with color-contrast issue';
    innerDiv.style.color = 'red';

    shadow.appendChild(innerDiv);
  }
}

customElements.define('inner-element', InnerElement);
class OuterElement extends HTMLElement {
  constructor() {
    super();
    const shadow = this.attachShadow({ mode: 'open' });

    const outerDiv = document.createElement('div');
    outerDiv.textContent = 'This is the outer element with button-name issue';
    outerDiv.style.color = 'blue';

    // Create a button with an accessibility issue (button-name)
    const button = document.createElement('button');

    const innerElement = document.createElement('inner-element');

    shadow.appendChild(outerDiv);
    shadow.appendChild(button); // Add button with accessibility issue
    shadow.appendChild(innerElement);
  }
}

customElements.define('outer-element', OuterElement);


</script>
